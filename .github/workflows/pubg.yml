name: PUBG recap

on:
  schedule:
    - cron: "*/30 * * * *"   # filet de sécurité si GitHub daigne un jour lancer le cron
  workflow_dispatch:
    inputs:
      recap:
        description: "Forcer le recap de la journée maintenant"
        type: boolean
        default: false

# un seul run à la fois ; le suivant attend que le précédent finisse
concurrency:
  group: pubg
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TZ: Europe/Paris
      PUBG_API_KEY: ${{ secrets.PUBG_API_KEY }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      DISCORD_WEBHOOK_REPORTS: ${{ secrets.DISCORD_WEBHOOK_REPORTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests

      - name: Boucle (script toutes les 5 min pendant ~5h40)
        run: |
          git config user.name "pubg-bot"
          git config user.email "pubg-bot@users.noreply.github.com"
          if [ "${{ inputs.recap }}" = "true" ]; then
            python pubg_recap.py --recap || true
          fi
          END=$((SECONDS + 340*60))
          while [ $SECONDS -lt $END ]; do
            echo "=== $(date '+%H:%M') ==="
            git pull -q --rebase || true
            python pubg_recap.py --once || true
            git add recap.db
            git diff --cached --quiet || { git commit -qm "db $(date -u +%Y-%m-%dT%H:%M)" && git push -q || true; }
            sleep 300
          done

      - name: Relancer le run suivant
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh workflow run pubg.yml --repo ${{ github.repository }}
