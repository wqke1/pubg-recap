name: PUBG recap

on:
  schedule:
    - cron: "*/30 * * * *"   # toutes les 30 min (UTC, GitHub peut décaler de quelques minutes)
  workflow_dispatch:
    inputs:
      recap:
        description: "Forcer le recap de la journée maintenant"
        type: boolean
        default: false

concurrency:
  group: pubg
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Paris
      PUBG_API_KEY: ${{ secrets.PUBG_API_KEY }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      DISCORD_WEBHOOK_REPORTS: ${{ secrets.DISCORD_WEBHOOK_REPORTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Recap + clips
        run: |
          if [ "${{ inputs.recap }}" = "true" ]; then
            python pubg_recap.py --recap
            python pubg_recap.py --reports
          else
            python pubg_recap.py --once
          fi
      - name: Sauvegarder la base
        run: |
          git config user.name "pubg-bot"
          git config user.email "pubg-bot@users.noreply.github.com"
          git add recap.db
          git diff --cached --quiet || git commit -m "db $(date -u +%Y-%m-%dT%H:%M)" 
          git push
